name: Release

# Si avvia solo con un tag di versione, per esempio: git tag v0.9.1-beta.1 && git push origin v0.9.1-beta.1
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build and verify installers without publishing'
        required: true
        default: '0.9.4'
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm      # il motore PyInstaller va costruito sull'architettura di destinazione
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.402"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: ${{ matrix.arch }}
      - name: Engine environment
        shell: pwsh
        run: |
          python -m venv forecast/.venv
          $py = "forecast/.venv/Scripts/python.exe"
          & $py -m pip install --upgrade pip
          # hf-xet non ha wheel cp312 per Windows ARM e serve solo a scaricare: si esclude (le dipendenze sono già bloccate)
          Get-Content forecast/requirements.lock | Where-Object { $_ -notmatch '^hf-xet==' } | Set-Content req.txt
          & $py -m pip install --no-deps -r req.txt --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { throw "Engine dependency installation failed" }
          & $py -m pip install pyinstaller==6.22.3 pytest
          if ($LASTEXITCODE) { throw "Build dependency installation failed" }
          & $py tools/fetch_model.py --model 28M
          if ($LASTEXITCODE) { throw "Model download failed" }
          & $py -m pytest -q forecast tools/tests
          if ($LASTEXITCODE) { throw "Python tests failed" }
      - name: .NET tests
        run: dotnet test windows/tests/BatteryForecast.Tests -c Release -r win-${{ matrix.arch }}
      - name: Inno Setup
        shell: pwsh
        # Installer ufficiale dalle release GitHub di jrsoftware/issrc, versione e SHA-256 fissati,
        # firma Authenticode verificata (jrsoftware.org/download.php restituisce una pagina HTML, non l'eseguibile).
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $sha = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          Invoke-WebRequest $url -OutFile innosetup.exe
          if ((Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "Inno Setup: SHA-256 mismatch" }
          $sig = Get-AuthenticodeSignature innosetup.exe
          if ($sig.Status -ne 'Valid') { throw "Inno Setup: signature $($sig.Status)" }
          $p = Start-Process .\innosetup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', '/SP-' -Wait -PassThru
          if ($p.ExitCode) { throw "Inno Setup install failed: $($p.ExitCode)" }
          $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc /? | Select-Object -First 1
      - name: Package
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          ./tools/package.ps1 -Version $version -Arch ${{ matrix.arch }}
      - name: Verify frozen package
        shell: pwsh
        run: |
          forecast/.venv/Scripts/python.exe tools/smoke_package.py artifacts/BatteryForecast --arch ${{ matrix.arch }} --report artifacts/package-smoke-${{ matrix.arch }}.json
          if ($LASTEXITCODE) { throw "Frozen package smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: |
            artifacts/BatteryForecast-Setup-*.exe
            artifacts/BatteryForecast-Setup-*.exe.sha256
            artifacts/*smoke-*.json
            artifacts/BatteryForecast/licenses/inventory.json

  # Installazione reale su un runner usa e getta, in un job a parte: il runner Windows ARM di GitHub a volte si
  # blocca del tutto in questo passo (ignora anche i timeout) e non deve tenere ferma la pubblicazione.
  # Dopo l’audit nativo, entrambi gli installer devono superare la verifica prima della pubblicazione.
  install-x64:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: installer-x64, path: artifacts }
      - name: Install, verify, update and uninstall on disposable runner
        timeout-minutes: 20
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts/BatteryForecast-Setup-*-x64.exe | Select-Object -First 1).FullName
          ./tools/test_installer.ps1 -Installer $setup -Arch x64 -Python python

  install-arm64:
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", architecture: arm64 }
      - uses: actions/download-artifact@v4
        with: { name: installer-arm64, path: artifacts }
      - name: Install, verify, update and uninstall on disposable runner
        timeout-minutes: 20
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts/BatteryForecast-Setup-*-arm64.exe | Select-Object -First 1).FullName
          ./tools/test_installer.ps1 -Installer $setup -Arch arm64 -Python python

  release:
    if: github.event_name == 'push'
    needs: [build, install-x64, install-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          pre=""; [[ "$tag" == *-* ]] && pre="--prerelease"
          # note della release: dalla sezione di questa versione in giù, senza il titolo del file
          awk -v head="## ${tag#v}" '$0 == head { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || cp CHANGELOG.md notes.md
          gh release create "$tag" dist/*.exe dist/*.exe.sha256 dist/*smoke-*.json --title "Battery Forecast ${tag#v}" --notes-file notes.md $pre --verify-tag
