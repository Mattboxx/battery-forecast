name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Test della logica senza il modello: i test con Timestral reale si saltano se i pesi mancano.
      - name: Python tests
        run: |
          python -m pip install numpy pytest
          python -m pytest -q forecast
      - name: .NET tests
        run: dotnet test windows/tests/BatteryForecast.Tests -c Release
